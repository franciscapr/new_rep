spring.application.name=backend

spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/mydatabase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect
#spring.datasource.url=jdbc:mysql://mysql-cdy2203:3306/mydatabase
spring.datasource.url=jdbc:mysql://localhost:3307/mydatabase
spring.datasource.username=myuser
spring.datasource.password=password

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

logging.level.org.springframework.web=trace
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate=trace
logging.level.com=TRACE
logging.file.name=backend.log

server.port=8180
spring.main.allow-bean-definition-overriding=true

# Seguridad de las cookies de sesión
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true